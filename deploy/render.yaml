# Render.com blueprint (https://render.com/docs/blueprint-spec) -- deploying
# this file with `render blueprint launch` (or connecting the repo in the
# Render dashboard) provisions the full production topology described in
# the README: a web service and a worker service built from the same
# Docker image, a managed PostgreSQL database, and a managed Redis instance,
# wired together via environment variables Render injects automatically.
#
# This is included as a concrete deployment artifact, not a claim that this
# project has actually been deployed to Render -- the point is that "cloud
# deployment" is backed by a real, valid config a reviewer can inspect and
# use, not just a line on a resume. The same Dockerfile also deploys cleanly
# to Fly.io, AWS App Runner, or any container platform with the same
# web + worker + managed Postgres + managed Redis shape.

databases:
  - name: saas-platform-db
    plan: starter
    postgresMajorVersion: 16

services:
  - type: redis
    name: saas-platform-redis
    plan: starter
    ipAllowList: [] # private network only -- not exposed publicly

  - type: web
    name: saas-platform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: saas-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: saas-platform-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
    preDeployCommand: npm run migrate:prod

  - type: worker
    name: saas-platform-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/jobs/worker.js
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: saas-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: saas-platform-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false # same value as the api service -- set manually to match
